<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>s i m s &amp; g a m e s</title>

	<link rel="stylesheet" href="../header.css">
	<link rel="stylesheet" href="../coolname.css">
	<link rel="stylesheet" href="../hac.css">
	<link rel="stylesheet" href="../cardgrid.css">
	<link rel="stylesheet" href="../footer.css">
</head>
<body>
	<header>
		<div id="coolname">
			<x>s</x><x>i</x><x>m</x><x>s</x><x>&amp;</x><x>g</x><x>a</x><x>m</x><x>e</x><x>s</x>
		</div>

		<div id="hac">
			<a href="..">home</a>
			|
			<a href="../about">about</a>
			|
			<a onclick="randomizeElementColors()">click me</a>
		</div>
	</header>

	<div id="cardgrid">
	</div>

	<footer>
		&copy; 2025 owen harrison
	</footer>

	<script>
		const cards = [
			{ name: "tracking", title: "&hearts; tracking", desc: "3d virtual position-triangulation thru multiple camera's frame-wise differences", explore: true, date: "nov 7, 2025" },
			{ name: "particles", title: "particles", desc: "particle system with collisions using an optimized spatial hash grid", explore: true, date: "aug 7, 2025" },
			{ name: "geometrize", title: "&hearts; geometrize", desc: "shape-abstracted images using a hill-climbing algorithm", explore: true, date: "jan 13, 2026" },
			{ name: "fracture", title: "fracture", desc: "3d model mesh split by plane and retriangulated", explore: true, date: "may 19, 2025" },
			{ name: "minesweeper3d", title: "&hearts; 3d minesweeper", desc: "the classic minesweeper game in 3d with intuitive orbit controls & cosmentic particle systems", explore: true, date: "sep 30, 2025" },
			{ name: "clock_sim", title: "clock sim", desc: "electromechanical 7-segment clock simulation", explore: true, date: "jan 25, 2026" },
			{ name: "rubiks_cube", title: "rubiks cube [wip]", desc: "interactive NxN twisty puzzle simulation", explore: true, date: "dec 28, 2025" },
			{ name: "cloth", title: "&hearts; cloth", desc: "3d flag-like mass-spring cloth simulation", explore: true, date: "may 22, 2025" },
			{ name: "meshing", title: "meshing", desc: "finite element analysis(fea) mesh generator", explore: true, date: "apr 15, 2026" },
			{ name: "a_star_nav", title: "a star nav", desc: "3d open world with a* navigation system", explore: true, date: "jul 2, 2025" },
			{ name: "asteroids", title: "&hearts; asteroids", desc: "the classic asteroids game with a pseudo-shader to imitate text-based console graphics", explore: false, date: "sep 21, 2025" },
			{ name: "marching_squares", title: "marching squares", desc: "contour generation using a signed distance function(SDF)", explore: true, date: "apr 30, 2025" },
			{ name: "slicer", title: "&hearts; slicer", desc: "voxelized mesh sliced into greedymeshed prisms", explore: true, date: "aug 30, 2025" },
			{ name: "magnets", title: "magnets[wip]", desc: "magnetic dipole particle simulation", explore: false, date: "may 25, 2026" },
			{ name: "targeting", title: "targeting", desc: "3d interactive scene with quaternion rotation, plane translation, and relative scaling", explore: true, date: "may 15, 2025" },
			{ name: "pixels", title: "&hearts; pixels", desc: "orientable bitmaps with physics and collision detection", explore: false, date: "feb 27, 2025" },
			{ name: "eulerian_fluid", title: "eulerian fluid", desc: "implementation of jos stam's <i>real-time fluid dynamics for games</i>", explore: false, date: "mar 9, 2025" },
			{ name: "splitter", title: "splitter", desc: "2d mesh split by plane and retriangulated", explore: true, date: "apr 12, 2026" },
			{ name: "smoke", title: "&hearts; smoke", desc: "attempt to procedurally imitate smoke-like effects with a particle system", explore: true, date: "apr 1, 2025" },
			{ name: "raycasting", title: "raycasting", desc: "casting shadows in all directions using digital differential analyzer(dda) tilemap ray intersections", explore: false, date: "feb 26, 2025" },
			{ name: "sokol_testing", title: "sokol testing", desc: "graphics engine development", explore: true, date: "feb 1, 2026" },
			{ name: "sketcher", title: "sketcher[wip]", desc: "sketchable iterative constraint solver", explore: false, date: "mar 8, 2026" },
			{ name: "steering_behaviors", title: "steering behaviors[wip]", desc: "implementation of craig reynolds' <i>boids</i> with a mouse fleeing rule", explore: false, date: "sep 9, 2025" },
			{ name: "planet_game", title: "planet game[wip]", desc: "3d spherical-coordinate based walking control system for an upcoming game", explore: false, date: "oct 20, 2025" },
			{ name: "jelly_car_clone", title: "jelly car clone[wip]", desc: "implementation of walaber entertainment's softbody physics system for the game <i>jelly car</i>", explore: false, date: "apr 10, 2025" },
			{ name: "rigid_bodies", title: "rigid bodies[wip]", desc: "attempt to imitate rigid body physics using seperating axis theorem(sat)", explore: false, date: "aug 24, 2025" },
		];

		let cardgrid = document.getElementById("cardgrid");

		//visual studio does NOT know how to format this.
		cards.forEach(c => {
			let src = "https://github.com/owenbharrison/simsAndGames/tree/main/" + c.name;
			let html = `
				<div class="card">
				<div class="thumb">
				<img src="${c.name}/thumbnail.png"/>
				</div>
				<div class="content">
				<h2>${c.title}</h2>
				<span>
				`;
			if (c.explore) {
				html += `
					<a href="${c.name}">explore</a>
					`;
			} else {
				html += `
					<a href="${c.name}/wasm">&#9655; run</a>
					`;
			}
			html += `
				|
				<a target="_blank" href="${src}">see code</a>
				</span >
				<p>${c.desc}</p>
				<span class="date">${c.date}</span>
				</div>
				</div>
				`;
			cardgrid.innerHTML += html;
		});
	</script>

	<script src="../click_me.js"></script>
</body>
</html>
