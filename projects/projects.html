	<script>
		let track = document.getElementById("poster-track");

		window.onpointerdown = e => {
			e.preventDefault();

			track.dataset.mouseDownAt = e.clientX;
		};

		window.onpointermove = e => {
			e.preventDefault();

			if (track.dataset.mouseDownAt === "0") return;

			let mouse_delta = parseFloat(track.dataset.mouseDownAt) - e.clientX;
			let max_delta = window.innerWidth;
			let pct = -100 * mouse_delta / max_delta;

			let next_pct = pct + parseFloat(track.dataset.prevPct);

			next_pct = Math.max(Math.min(next_pct, 0), -100);

			track.dataset.pct = next_pct;

			//track.style.transform = `translate(${next_pct}%, -50%)`;
			track.animate({
				transform: `translate(${next_pct}%, -50%)`
			}, { duration: 1200, fill: "forwards" });

			//scroll images
			for (let img of track.getElementsByClassName("poster")) {
				//img.style.objectPosition = `${100 + next_pct}% 50%`;
				img.animate({
					backgroundPosition: `${100 + next_pct}% 50%`
				}, { duration: 1200, fill: "forwards" });
			}
		};

		window.onpointerup = e => {
			e.preventDefault();

			track.dataset.mouseDownAt = "0";
			track.dataset.prevPct = track.dataset.pct;
		};
	</script>
