<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>c o n c e p t s</title>

	<link rel="stylesheet" href="../header.css">
	<link rel="stylesheet" href="../coolname.css">
	<link rel="stylesheet" href="../hac.css">
	<link rel="stylesheet" href="../cardgrid.css">
	<link rel="stylesheet" href="../footer.css">

</head>
<body>
	<header>
		<div id="coolname">
			<x>c</x><x>o</x><x>n</x><x>c</x><x>e</x><x>p</x><x>t</x><x>s</x>
		</div>
		<div id="hac">
			<a href="..">home</a>
			|
			<a href="../about">about</a>
			|
			<a onclick="randomizeElementColors()">click me</a>
		</div>
	</header>

	<div id="cardgrid">
	</div>

	<footer>
		&copy; 2026 owen harrison
	</footer>

	<script>
		let cardgrid = document.getElementById("cardgrid");

		const cards = [
			{ name: "greedy_meshing", title: "&hearts;greedy meshing", desc: "mesh optimization algorithm for tilemap-like renderers", date: "dec 7, 2024" },
			{ name: "divergence", title: "divergence", desc: "divergence of fluid for staggered grid implementation", date: "sep 22, 2025" },
			{ name: "tree_generation", title: "&hearts;tree generation", desc: "procedural branch-like tree generation", date: "apr 9, 2024" },
			{ name: "ball_balancer", title: "ball_balancer", desc: "responsive kinematics system to balance ball on plate", date: "sep 13, 2024" },
			{ name: "multiplexing", title: "&hearts;multiplexing", desc: "saving on number of data signals based on clever organization", date: "oct 6, 2024" },
			{ name: "raytracing", title: "raytracing", desc: "viewport ray direction computations", date: "dec 9, 2022" },
            { name: "splitter", title: "splitter", desc: "split 2d shape by plane", date: "mar 16, 2026" },
            { name: "hoberman", title: "hoberman", desc: "hoberman linkage construction", date: "mar 8, 2026" },
			{ name: "sequential_segments", title: "sequential segments", desc: "fancy handwriting like segment-wise activation order", date: "oct 21, 2024" },
			{ name: "shape_matching", title: "&hearts;shape matching", desc: "shape-keeping softbody physics algorithm", date: "apr 7, 2025" },
			{ name: "tracking", title: "&hearts;tracking", desc: "virtual position-triangulation thru multiple camera's frame-wise differences", date: "oct 4, 2025" },
			{ name: "ui_layout", title: "ui layout", desc: "bounding-box modeled ui layout system", date: "sep 21, 2024" },
			{ name: "voxel_rendering", title: "&hearts;voxel rendering", desc: "voxel meshing algorithm utilizing greedy meshing along 6 planes", date: "dec 7, 2024" }
		];

		cards.forEach(c => {
			cardgrid.innerHTML += `
			<div class="card">
			<div class="thumb">
			<img src="thumbnails/${c.name}.png"/>
			</div>
			<div class="content">
			<h2>${c.title}</h2>
			<span><a href="${c.name}.pdf">see pdf</a></span>
			<p>${c.desc}</p>
			<span class="date">${c.date}</span>
			</div>
			</div>
			`;
		});
	</script>

	<script src="../click_me.js"></script>
</body>
</html>
